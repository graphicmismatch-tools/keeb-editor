    <script>
        // The only JavaScript: file download, a localStorage draft, the system color scheme, and the preview's width (for resizing keys).
        window.keeb = {
            download(name, text) {
                const a = document.createElement("a");
                a.href = URL.createObjectURL(new Blob([text], { type: "application/json" }));
                a.download = name;
                a.click();
                setTimeout(() => URL.revokeObjectURL(a.href), 1000);
            },
            load(key) { try { return localStorage.getItem(key); } catch { return null; } },
            save(key, value) { try { localStorage.setItem(key, value); } catch { } },
            dark() { return matchMedia("(prefers-color-scheme: dark)").matches; },
            width(el) { return el.getBoundingClientRect().width; },
        };
    </script>
