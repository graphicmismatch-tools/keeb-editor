# Publishes the editor to GitHub Pages at https://graphicmismatch.github.io/keeb-editor/ on every push to master.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet publish src/KeebEditor -c Release -o out
      # Served from /keeb-editor/, not the root. Pages compresses on its own, so the .br/.gz copies are dead weight,
      # and .nojekyll keeps Jekyll from dropping the _framework folder.
      - run: |
          sed -i 's#<base href="/" />#<base href="/keeb-editor/" />#' out/wwwroot/index.html
          find out/wwwroot \( -name '*.br' -o -name '*.gz' \) -delete
          touch out/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
